# Dev-instance configuration. Only this file, the three include files and the
# .gitignore are versioned — everything else HA writes into /config (auth,
# recorder db, logs) is runtime state and stays local.

default_config:

homeassistant:
  name: Baby Log Book Dev
  country: DE
  time_zone: Europe/Berlin
  unit_system: metric
  currency: EUR
  language: de
  latitude: 52.52
  longitude: 13.405
  elevation: 34

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# The recorder's SQLite database cannot live on the bind-mounted /config: the
# workspace filesystem does not give it the locking it needs, so it declares
# itself corrupt every three seconds and leaves a renamed copy behind. Keep it
# inside the container, where it is throwaway state like the rest of it.
recorder:
  db_url: sqlite:////tmp/home-assistant_v2.db
